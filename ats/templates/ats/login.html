<div class="modal fade" id="login_modal" tabindex="-1" role="dialog" aria-labelledby="login_modal_label" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content rounded-4 shadow">
            <div class="modal-header p-5 pb-4 border-bottom-0">
                <h1 class="fw-bold mb-0 fs-2">ATS belépés</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-5 pt-0">
                <form id="modal_login_form">
                    {% csrf_token %}
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control rounded-3" id="modal_email" name="email" placeholder="name@local.host" required>
                        <label for="modal_email">E-mail-cím</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control rounded-3" id="modal_password" name="password" placeholder="Password" required>
                        <label for="modal_password">Jelszó</label>
                    </div>
                    <div id="login_error" class="text-danger small mb-2"></div>
                    <button class="w-100 mb-2 btn btn-lg rounded-3 btn-primary" type="submit">BELÉPEK</button>
                </form>
            </div>
        </div>
    </div>
</div>
